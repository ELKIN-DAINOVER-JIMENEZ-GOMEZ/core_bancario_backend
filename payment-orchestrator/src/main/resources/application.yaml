# Configuración base para payment-orchestrator
spring:
  application:
    name: payment-orchestrator

  # ── BASE DE DATOS ──────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5535/payment_db}
    username: ${DB_USERNAME:payment_user}
    password: ${DB_PASSWORD:Dainover}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PaymentHikariPool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / HIBERNATE ────────────────────────────────────────────────────────
  jpa:
    hibernate:
      # 'update' en dev crea solo la columna/índice nuevos (transactions.idempotency_key).
      # En prod usar 'validate' y aplicar la migración SQL antes de desplegar (ver README).
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ── KAFKA ──────────────────────────────────────────────────────────────────
  # El CONSUMER no se configura aquí: lo construye KafkaConsumerConfig (deserializa
  # como String y convierte a JSON por tipo de parámetro; lee KAFKA_BOOTSTRAP_SERVERS
  # y SPRING_KAFKA_CONSUMER_GROUP_ID directamente del entorno).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

  # ── SECURITY: Resource Server JWT ─────────────────────────────────────────
  # El mismo JwtDecoder valida el REST y el handshake del WebSocket (/ws/payments?token=...)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://auth-service:8081}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

# ── SERVIDOR ────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8083}

# ── FEIGN ────────────────────────────────────────────────────────────────────
feign:
  client:
    config:
      account-service:
        url: ${ACCOUNT_SERVICE_URL:http://account-service:8082}
        connectTimeout: 3000
        readTimeout: 5000

# ── SAGA ─────────────────────────────────────────────────────────────────────
# La evaluación de fraude la hace el microservicio fraud-engine (vía Kafka);
# aquí solo se define cuánto espera el orquestador.
# ⏳ Los leerá SagaTimeoutScheduler (aún no implementado).
saga:
  fraud-check-timeout-seconds: ${FRAUD_CHECK_TIMEOUT_SECONDS:10}   # sin respuesta → FRAUD_REJECTED (fail-closed)
  ledger-timeout-seconds: ${LEDGER_TIMEOUT_SECONDS:30}             # sin asientos → compensación

# ── WEBSOCKET ────────────────────────────────────────────────────────────────
websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:*}   # en producción: restringir al dominio del frontend

# ── LOGGING ─────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.finnode: DEBUG
    org.springframework.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ── ACTUATOR ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# ── FINNODE ──────────────────────────────────────────────────────────────────
finnode:
  env: ${FINNODE_ENV:local}